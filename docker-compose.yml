services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: on-failure
  client:
    depends_on:
      - server
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - "8080:80"
    restart: on-failure
